name: Deploy Mini App to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "miniapp-static/**"
      - "packs/**"
      - ".github/workflows/deploy-miniapp-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate packs.json
        run: |
          node -e "const packs=require('./packs'); const fs=require('fs'); fs.mkdirSync('miniapp-static',{recursive:true}); fs.writeFileSync('miniapp-static/packs.json', JSON.stringify(packs)); console.log(Object.keys(packs).length+' packs')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
